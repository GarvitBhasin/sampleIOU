plugins {
    id 'java'
    id 'application'
}

group = 'edu.ubc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Loaded by the application at runtime when DATABASE_URL points to PostgreSQL/Neon.
    runtimeOnly 'org.postgresql:postgresql:42.7.15'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.2'
}

application {
    mainClass = 'splitter.server.ServerMain'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
